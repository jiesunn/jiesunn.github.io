baseURL: "https://jiesunn.github.io/"
title: "JieSunn - BLOG"
languageCode: "zh-CN"
theme: "PaperMod"

params:
  ShowCodeCopyButtons: true
  ShowReadingTime: true
  ShowShareButtons: true
  ShowLastMod: false
  homeInfoParams:
    Title: "你好，欢迎来到我的博客"
    Content: >
      这里记录技术笔记与日常思考。

frontmatter:
  lastmod:
    - lastmod
    - :git
    - :fileModTime
    - :default

menu:
  main:
    - identifier: categories
      name: 分类
      url: /categories/
      weight: 10
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 20
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30